name: betcode_app
description: "BetCode - Mobile client for Claude Code agent sessions via gRPC."
publish_to: 'none'
version: 0.1.0-alpha.1

environment:
  sdk: ^3.10.8

dependencies:
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.8
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_highlight: ^0.7.0
  flutter_markdown_plus: ^1.0.7
  flutter_riverpod: ^3.2.1
  flutter_secure_storage: ^10.0.0
  freezed_annotation: ^3.1.0
  go_router: ^17.1.0
  grpc: ^5.1.0
  json_annotation: ^4.10.0
  package_info_plus: ^9.0.0
  protobuf: ^6.0.0
  riverpod_annotation: ^4.0.2
  uuid: ^4.5.2

dev_dependencies:
  build_runner: ^2.11.0
  drift_dev: ^2.31.0
  fake_async: ^1.3.2
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  riverpod: ^3.2.1
  riverpod_generator: ^4.0.3
  very_good_analysis: ^10.1.0

# Workaround: Flutter SDK pins test_api 0.7.7, but riverpod 3.2.1
# depends on test ^1.0.0 and code generators (freezed, riverpod_generator)
# require analyzer >=9.0.0 which needs test >=1.27.0 (test_api 0.7.8+).
# See: https://github.com/rrousselGit/riverpod/issues/4364
dependency_overrides:
  test: 1.29.0
  test_api: 0.7.9

flutter:
  uses-material-design: true
